name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Dependencies
        run: bun install

      - name: Build Web Assets
        run: |
          bun run build
          node -e '
            const fs = require("fs");
            const path = require("path");
            const clientDir = path.resolve("dist/client");
            const assetsDir = path.join(clientDir, "assets");
            const files = fs.readdirSync(assetsDir);
            const jsFile = files.find(f => f.startsWith("index-") && f.endsWith(".js"));
            const cssFile = files.find(f => f.startsWith("styles-") && f.endsWith(".css"));
            const html = `<!DOCTYPE html>
            <html lang="en">
              <head>
                <meta charset="UTF-8" />
                <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
                <title>Noor Habit</title>
                \${cssFile ? \`<link rel="stylesheet" href="/assets/\${cssFile}">\` : ""}
              </head>
              <body>
                <div id="root"></div>
                \${jsFile ? \`<script type="module" src="/assets/\${jsFile}"></script>\` : ""}
              </body>
            </html>`;
            fs.writeFileSync(path.join(clientDir, "index.html"), html, "utf-8");
            console.log("Generated dist/client/index.html successfully");
          '

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Habit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Noor Habit APK Release
          tag_name: v1.0.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
