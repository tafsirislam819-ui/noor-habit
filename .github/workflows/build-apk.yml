name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Install Dependencies
        run: bun install

      - name: Build Web Assets & Prerender Hydration HTML
        run: |
          bun run build
          PORT=3456 HOST=127.0.0.1 bun dist/server/index.mjs &
          SERVER_PID=$!
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3456/ > /dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done
          curl -s http://127.0.0.1:3456/ > dist/client/index.html
          kill $SERVER_PID || true
          echo "Prerendered hydration HTML size: $(wc -c < dist/client/index.html) bytes"
          head -n 5 dist/client/index.html

      - name: Initialize & Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi
          bunx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noor-Habit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Noor Habit APK Release
          tag_name: v1.0.0
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
